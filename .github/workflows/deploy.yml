name: Deploy React App to GitHub Pages

# O site e servido pelo branch gh-pages. Este workflow constroi o projeto e
# publica o resultado la a cada push no main, fazendo automaticamente o mesmo
# que o `npm run deploy` fazia na maquina de quem lembrasse de rodar.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Necessario para o job conseguir escrever no branch gh-pages.
permissions:
  contents: write

# Se dois pushes acontecerem juntos, o segundo espera o primeiro terminar em vez
# de publicar por cima pela metade.
concurrency:
  group: "deploy-gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gera dist/. O script postbuild do package.json cria o dist/404.html, e o
      # public/CNAME entra no dist sozinho, preservando o dominio proprio.
      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
