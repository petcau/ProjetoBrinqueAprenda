<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuleiro - MATEMÁGICA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ajuste-telas.css">
</head>

<body class="tela-tabuleiro">
  <div id="game-scale">
    <!-- 🎵 ÁUDIO DE FUNDO DESTA TELA -->
    <audio id="bgm" src="musics/Pelas Estradas Mágicas.mp3" loop preload="auto"></audio>

    <div class="container-tabuleiro">
      <div class="info-jogador">
        <p id="nomeJogadorDisplay"></p>
        <button id="btnJogarDado" class="btn-dado">
          <span class="dado-icone" aria-hidden="true">🎲</span>
          <span>Jogar Dado</span>
        </button>
        <p id="resultadoDado"></p>
      </div>

      <div class="tabuleiro" id="tabuleiro"></div>

      <!-- Pergunta -->
      <div class="tela-pergunta" id="telaPergunta" style="display:none;">
        <div class="resultado-dado-pergunta" aria-live="polite">
          <div class="face-dado" id="faceDadoPergunta" data-valor="1" role="img" aria-label="Resultado do dado: 1">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <div>
            <span class="rotulo-dado">Resultado do dado</span>
            <strong id="numeroDadoPergunta">1</strong>
          </div>
        </div>
        <div class="caixa-pergunta">
          <p id="contextoPergunta" class="contexto-pergunta"></p>
          <h2 id="textoPergunta"></h2>
          <p class="instrucao-pergunta">Escolha a resposta correta:</p>
          <div class="alternativas-pergunta" id="alternativasResposta"></div>
        </div>
      </div>

      <!-- Feedback -->
      <div class="feedback" id="feedback" style="display:none;">
        <div class="caixa-feedback" id="caixaFeedback">
          <h2 id="feedbackTitulo"></h2>
        </div>
      </div>

      <!-- Tela Final -->
      <div class="tela-final" id="telaFinal" style="display:none;">

        <!-- confetes -->
        <div id="confetesContainer" class="confetes-container"></div>

        <h1 id="tituloFinal">🎉 Missão cumprida!</h1>

        <!-- Área com castelo + vencedor lado a lado -->
        <div class="final-content">
          <img src="images/castelo.png" alt="Castelo" class="img-castelo">
          <img id="imgVencedor" class="img-vencedor" src="" alt="Vencedor">
        </div>

        <h2 id="textoVencedor">Você chegou ao castelo!</h2>

      </div>



      <!-- JS do jogo -->
      <script src="script.js"></script>

      <!-- 🎵 CONTINUIDADE DA MÚSICA + BRILHO / VOLUME -->
      <script>
        (function () {
          const audio = document.getElementById("bgm");
          if (!audio) return;

          // Lê preferências de som/brilho salvas (mm_prefs)
          let prefs = {};
          try {
            const stored = localStorage.getItem("mm_prefs");
            if (stored) prefs = JSON.parse(stored);
          } catch (e) {
            prefs = {};
          }

          const volume = (prefs.som !== undefined) ? prefs.som : 70;
          const brilho = (prefs.brilho !== undefined) ? prefs.brilho : 100;

          // Aplica brilho na página toda
          document.documentElement.style.filter = "brightness(" + (brilho / 100) + ")";

          // 🔁 Lê o tempo salvo da música para continuar de onde parou
          let ultimoTempo = 0;
          try {
            const t = localStorage.getItem("musica_tempo");
            if (t !== null) ultimoTempo = parseFloat(t) || 0;
          } catch (e) {
            ultimoTempo = 0;
          }

          function iniciarAudioContinuo() {
            audio.currentTime = ultimoTempo;
            audio.volume = volume / 100;

            audio.play().catch(err => {
              console.warn("Autoplay bloqueado nesta tela (tabuleiro):", err);
            });
          }

          if (audio.readyState >= 1) {
            iniciarAudioContinuo();
          } else {
            audio.addEventListener("loadedmetadata", iniciarAudioContinuo);
          }

          setInterval(() => {
            try {
              localStorage.setItem("musica_tempo", audio.currentTime.toString());
            } catch (e) { }
          }, 200);
        })();
      </script>
    </div>

    <!-- O botao passa para DENTRO do #game-scale: assim ele e reduzido junto
         com o resto e fica sempre no mesmo ponto do pergaminho. Estava fora,
         preso a janela, e por isso aparecia sobre a madeira. -->
    <button type="button" class="botao-menu-jogo" onclick="window.location.replace('index.html')">
      Menu
    </button>

    <button type="button" class="botao-som-jogo" id="btnSom" aria-pressed="false"
            aria-label="Desligar o som" title="Ligar ou desligar o som">
      <span id="iconeSom" aria-hidden="true">🔊</span>
    </button>
  </div>

  <!-- Liga/desliga o som. Usa o mesmo mm_prefs que a tela de Opcoes ja grava,
       com um campo "mudo" a mais — assim o volume escolhido nas Opcoes nao se
       perde ao silenciar, e a escolha sobrevive a troca de tela. -->
  <script>
    (function () {
      var audio = document.getElementById("bgm");
      var botao = document.getElementById("btnSom");
      var icone = document.getElementById("iconeSom");
      if (!audio || !botao) return;

      function lerPrefs() {
        try {
          return JSON.parse(localStorage.getItem("mm_prefs") || "{}");
        } catch (e) {
          return {};
        }
      }

      function aplicar(mudo) {
        audio.muted = mudo;
        icone.textContent = mudo ? "🔇" : "🔊";
        botao.setAttribute("aria-pressed", mudo ? "true" : "false");
        botao.setAttribute("aria-label", mudo ? "Ligar o som" : "Desligar o som");
      }

      var prefs = lerPrefs();
      aplicar(prefs.mudo === true);

      botao.addEventListener("click", function () {
        var atual = lerPrefs();
        atual.mudo = !audio.muted;
        aplicar(atual.mudo);
        try {
          localStorage.setItem("mm_prefs", JSON.stringify(atual));
        } catch (e) { }
      });
    })();
  </script>

  <!-- Liga a escala global que o #game-scale ja previa. Ver escala-tela.js -->
  <script src="escala-tela.js"></script>
</body>

</html>
